<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>しょうあくんの ちょうせんアプリ 20</title>
<style>
  body { font-family: 'Hiragino Maru Gothic ProN', 'Comic Sans MS', sans-serif; background-color: #E0F7FA; text-align: center; margin: 0; padding: 20px; color: #333; }
  .card { background: white; border-radius: 20px; padding: 30px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); max-width: 500px; margin: 20px auto; display: none; border: 5px solid #0288D1; }
  .active { display: block; animation: fadeIn 0.5s; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  h1 { color: #0277BD; font-size: 24px; }
  .emoji { font-size: 80px; margin: 15px 0; }
  .btn { background-color: #FF8F00; color: white; border: none; padding: 15px 30px; font-size: 20px; border-radius: 50px; cursor: pointer; box-shadow: 0 5px 15px rgba(255,143,0,0.4); margin-top: 20px; display: inline-block; width: 85%; font-weight: bold; }
  .btn:hover { background-color: #FFA000; transform: scale(1.05); transition: 0.2s; }
  .nav-btn { background-color: #43A047; box-shadow: 0 5px 15px rgba(67,160,71,0.4); }
  .nav-btn:hover { background-color: #4CAF50; }
  .menu-btn { background-color: #039BE5; margin: 8px; width: 45%; font-size: 16px; padding: 10px; border-radius: 15px;}
  .menu-btn:hover { background-color: #29B6F6; }
  .menu-container { display: flex; flex-wrap: wrap; justify-content: center; max-height: 60vh; overflow-y: auto; padding-bottom: 20px;}
  p { font-size: 18px; line-height: 1.6; }
  .highlight { color: #D84315; font-weight: bold; }
</style>
</head>
<body>

<div id="screen-menu" class="card active">
  <h1>しょうあくんの<br>ちょうせんアプリ🌟(全20問)</h1>
  <div class="emoji">👦✨</div>
  <p>きょうも げんきに がんばろう！<br>どの もんだいに ちょうせんする？</p>
  <div class="menu-container" id="menu-list">
    <!-- Menu generated by JS -->
  </div>
</div>

<div id="screen-step1" class="card">
  <h1 id="title1">もんだい：つくる✂️</h1>
  <div class="emoji" id="emoji1">🏅</div>
  <p id="desc1" class="highlight">説明1</p>
  <button class="btn nav-btn" onclick="nextScreen('screen-step2')">できた！</button>
  <button class="btn" style="background-color: #999; padding: 10px;" onclick="nextScreen('screen-menu')">やめる</button>
</div>

<div id="screen-step2" class="card">
  <h1 id="title2">もんだい：えをかく🖍️</h1>
  <div class="emoji" id="emoji2">🎨</div>
  <p id="desc2">説明2</p>
  <button class="btn nav-btn" onclick="nextScreen('screen-step3')">かけた！</button>
</div>

<div id="screen-step3" class="card">
  <h1 id="title3">もんだい：おはなしする🗣️</h1>
  <div class="emoji" id="emoji3">👩‍🏫</div>
  <p id="desc3">説明3</p>
  <button class="btn" onclick="nextScreen('screen-menu')">メニューにもどる</button>
</div>

<script>
  const problems = [
    { title: "まほうのどうぐ", emoji: "🐶🪄", s1: "かみコップとわゴムで「こまっているどうぶつをたすける まほうのどうぐ」をつくろう！", s2: "がようしに、そのどうぐでどうぶつをたすけているえをかこう！", s3: "せんせいに、どうやってたすけたかおしえてね！" },
    { title: "ふしぎないきもの", emoji: "👽🌟", s1: "ほしのかたちをきりぬいて、がようしに「うちゅうでみつけた ふしぎないきもの」のえをかこう！", s2: "きりぬいたほしで、いきもののいちぶぶんをかくしてみよう！", s3: "せんせいにヒントをだして、なにをかくしたかあててもらおう！" },
    { title: "ニコニコたべもの", emoji: "🌈🍎", s1: "カラーねんどで「かぞくをニコニコにする ふしぎなたべもの」をつくろう！", s2: "がようしに、そのたべものをかぞくとたべているえをかこう！", s3: "どんなあじがして、かぞくがなんていったかおしえてね！" },
    { title: "まほうのもり", emoji: "🌳✨", s1: "「おともだちといっしょにいきたい まほうのもり」をそうぞうしてみよう！", s2: "がようしに、そのもりでいちばんたのしいあそびのえをかこう！", s3: "だれといっしょに、どんなあそびをしたかおしえてね！" },
    { title: "こわれたおもちゃ", emoji: "🧸🩹", s1: "おりがみをちぎって、がようしに「こわれてしまった たいせつなおもちゃ」のえをかこう。", s2: "それをどうやってなおしたか、えをかき足そう！", s3: "どうやってなおしたか、せんせいにおはなししてね！" },
    { title: "まちのおもしろい顔", emoji: "🏠👀", s1: "かみざらと毛糸で「まちの おもしろい顔（ポストやカンバンなど）」をつくろう！", s2: "がようしに、その顔がどこにあるかのちずをかこう！", s3: "どこがおもしろいのか、せんせいにせつめいしてね！" },
    { title: "ひとりでできるもん", emoji: "👔👦", s1: "あさおきてからおでかけするまでに、ひとりでできるようになったことをおもいだそう！", s2: "がようしに、できるようになったことを３つかこう！", s3: "どれがいちばんとくいか、おしえてね！" },
    { title: "ありがとうの箱", emoji: "🎁💖", s1: "あきばこをつかって「『ありがとう』をあつめる箱」をつくろう！", s2: "がようしに、だれのどんなありがとうをあつめたかえをかこう！", s3: "どんなありがとうがあつまったか、おはなししてね！" },
    { title: "虫たちの学校", emoji: "🐛🏫", s1: "はっぱや小枝をつかって、がようしに「虫たちのひみつの学校」をつくろう！", s2: "そこで虫たちはなにをべんきょうしているか、えをかこう！", s3: "どんなべんきょうをしているか、せんせいにおしえてね！" },
    { title: "みらいのじぶん", emoji: "🔭👨‍🚀", s1: "がようしのまんなかにあなをあけて、そこからのぞく「みらいのじぶん」をかこう！", s2: "みらいのじぶんは、どんなすごいことをしているかな？", s3: "みらいのじぶんが、いまのしょうあくんに何とこえをかけているかおしえてね！" },
    { title: "ケガをした木", emoji: "🌳🩹", s1: "ばんそうこう（テープ）をつかって、がようしに「ケガをした大きな木」をかこう。", s2: "しょうあくんが、どうやってその木をげんきにするかえをかこう！", s3: "どうやってたすけてあげたか、おはなししてね！" },
    { title: "ニコニコのおやくそく", emoji: "🤝😊", s1: "がようしに「みんながつかう こうえん」のえをかこう！", s2: "そこに、まほうのペンで「みんながニコニコになるおやくそく」をかき足そう！", s3: "どんなおやくそくをつくったか、せんせいにせつめいしてね！" },
    { title: "とおくの音をきく", emoji: "👂🎶", s1: "トイレットペーパーのしんで「とおくの おもしろい音がきこえるどうぐ」をつくろう！", s2: "がようしに、どんな音がきこえたかえをかこう！", s3: "だれの、どんな音がきこえてきたかおしえてね！" },
    { title: "かぞくのじまん", emoji: "👨‍👩‍👦✨", s1: "がようしに「おうちの人（パパ、ママ、おにいちゃん）」のにがおえをかこう！", s2: "その人の「いちばんすごいところ」のえをかきたそう！", s3: "かぞくのすごいところを、せんせいにじまんしてね！" },
    { title: "かなしい→うれしい", emoji: "😢➡️😄", s1: "いろがようしをちぎって、がようしに「かなしかったこと」をかこう。", s2: "そのあと、「うれしくなったこと」にへんしんさせよう！", s3: "どうやってうれしいきもちになったか、おはなししてね！" },
    { title: "おかしの星とロケット", emoji: "🚀🍬", s1: "かみコップをかさねて「ロケット」をつくろう！", s2: "がようしに、ロケットがとうちゃくした「おかしの星」のちずをかこう！", s3: "おかしの星はどんなところか、せんせいにおしえてね！" },
    { title: "３まいのカード", emoji: "🃏🗣️", s1: "カード３まいに「たね」「お花」「えがお」のえをかこう！", s2: "カードをすきなじゅんばんにならべてみよう。", s3: "ならべたカードで、１つのおはなしをつくっておしえてね！" },
    { title: "あしが６本と０本", emoji: "🐙🐍", s1: "がようしに「あしが６本のどうぶつ」と「あしが０本のどうぶつ」をかこう！", s2: "２ひきが、いっしょになかよくあそんでいるえをかこう！", s3: "どんなあそびをしているか、おはなししてね！" },
    { title: "なまえとすきなもの", emoji: "🔤🏎️", s1: "モールをまげて「『し』と『ょ』と『う』と『あ』」など、なまえの文字をつくろう！", s2: "がようしにはりつけ、まわりにすきなものをたくさんかこう！", s3: "どんなものがすきなのか、じゅんばんにおしえてね！" },
    { title: "いまのじぶんとしょうがくせい", emoji: "👦➡️🎒", s1: "がようしをはんぶんにおり、おもてに「いまのしょうあくん」をかこう！", s2: "うらに「けいおうの しょうがくせいになった しょうあくん」をかこう！", s3: "なにがかっこよくかわったか、せんせいにせつめいしてね！" }
  ];

  const menuList = document.getElementById('menu-list');
  problems.forEach((p, index) => {
    const btn = document.createElement('button');
    btn.className = 'btn menu-btn';
    btn.innerHTML = `${index + 1}. ${p.title}`;
    btn.onclick = () => startProblem(index);
    menuList.appendChild(btn);
  });

  function nextScreen(id) {
    document.querySelectorAll('.card').forEach(card => card.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  function startProblem(index) {
    const p = problems[index];
    document.getElementById('title1').innerText = `第${index+1}問：つくる✂️`;
    document.getElementById('emoji1').innerText = p.emoji;
    document.getElementById('desc1').innerText = p.s1;

    document.getElementById('title2').innerText = `第${index+1}問：えをかく🖍️`;
    document.getElementById('emoji2').innerText = '🎨';
    document.getElementById('desc2').innerText = p.s2;

    document.getElementById('title3').innerText = `第${index+1}問：おはなしする🗣️`;
    document.getElementById('emoji3').innerText = '👩‍🏫';
    document.getElementById('desc3').innerText = p.s3;

    nextScreen('screen-step1');
  }
</script>
</body>
</html>
